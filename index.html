<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDT Store | Sistema 100%</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #8b5cf6; --bg: #0f172a; --c: #1e1b4b; --t: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; }
        header { background: #2e1065; padding: 1rem; border-bottom: 2px solid var(--p); display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button { flex: 1; padding: 12px; background: var(--c); color: white; border: 1px solid var(--p); border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tabs button.active { background: var(--p); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .item { background: var(--c); padding: 10px; border-radius: 8px; border: 1px solid #312e81; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid var(--p); color: white; border-radius: 6px; box-sizing: border-box; }
        .pedido-card { background: var(--c); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--p); animation: slide 0.3s ease; }
        .btn-enviar { background: var(--p); color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; }
        @keyframes slide { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

<audio id="som" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<div id="telaAuth" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: var(--c); padding: 30px; border-radius: 15px; width: 300px; border: 1px solid var(--p); text-align: center;">
        <h2 style="color:var(--p)">MDT LOGIN</h2>
        <input id="u" type="text" placeholder="Usuário">
        <input id="s" type="password" placeholder="Senha">
        <button onclick="entrar()" class="btn-enviar">Entrar</button>
        <button onclick="cadastrar()" style="background:none; border:none; color:var(--p); cursor:pointer; margin-top:10px">Criar Conta</button>
    </div>
</div>

<div id="telaSite" style="display:none;">
    <header>
        <span>🚀 MDT <b>SISTEMA</b></span>
        <button onclick="location.reload()" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer">Sair</button>
    </header>

    <div class="container">
        <div class="tabs">
            <button id="t1" class="active" onclick="aba('comprar')">🛒 Comprar</button>
            <button id="t2" onclick="aba('historico')">📜 Meus Pedidos</button>
            <button id="t3" style="display:none; color:#fbbf24" onclick="aba('operador')">🛠 Operador</button>
        </div>

        <div id="p-comprar">
            <select id="tabPreco">
                <option value="normal">Tabela Normal</option>
                <option value="parceiro">Tabela Parceiro (VIP)</option>
            </select>
            <div class="grid" id="itensGrid"></div>
            <button onclick="enviar()" class="btn-enviar">Confirmar e Enviar Pedido</button>
        </div>

        <div id="p-historico" style="display:none;">
            <h3>Acompanhamento de Status</h3>
            <div id="meusPedidos"></div>
        </div>

        <div id="p-operador" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <h3>Painel de Operações</h3>
                <button onclick="limpar()" style="color:#ef4444; background:none; border:none; cursor:pointer; font-weight:bold">Limpar Tudo</button>
            </div>
            <div id="adminPedidos"></div>
        </div>
    </div>
</div>

<script>
// CONEXÃO SUPABASE
const _sb = window.supabase.createClient("https://gznoajgxxklgspeobgqj.supabase.co", "sb_publishable_WDaRdocyOlxyOPtb3LkWsA_l7_U0Nnc");

const precos = {
    normal: { fuzil:500000, sniper:200000, smg:130000, pistola:80000, c4:25000, dinamite:10000, c1:20000, c2:20000, c3:20000, c4card:50000, c5:60000, msniper:8000, mrifle:900, msmg:800 },
    parceiro: { fuzil:400000, sniper:160000, smg:105000, pistola:64000, c4:20000, dinamite:6000, c1:15000, c2:15000, c3:15000, c4card:45000, c5:55000, msniper:7500, mrifle:850, msmg:750 }
};

const nomes = { fuzil:"🔫 Fuzil", sniper:"🎯 Sniper", smg:"🔫 SMG", pistola:"🔫 Pistola", c4:"💣 C4", dinamite:"🧨 Dinamite", c1:"💳 N1", c2:"💳 N2", c3:"💳 N3", c4card:"💳 N4", c5:"💳 N5", msniper:"📦 M. Sniper", mrifle:"📦 M. Rifle", msmg:"📦 M. SMG" };

let logado = null;
let ultimoId = 0;

// Gerar inputs
for(let id in nomes) {
    document.getElementById('itensGrid').innerHTML += `<div class="item"><span>${nomes[id]}</span><input type="number" id="q_${id}" placeholder="0" min="0"></div>`;
}

function aba(x) {
    document.getElementById('p-comprar').style.display = x==='comprar'?'block':'none';
    document.getElementById('p-historico').style.display = x==='historico'?'block':'none';
    document.getElementById('p-operador').style.display = x==='operador'?'block':'none';
    document.getElementById('t1').className = x==='comprar'?'active':'';
    document.getElementById('t2').className = x==='historico'?'active':'';
    document.getElementById('t3').className = x==='operador'?'active':'';
    if(x==='historico') carregarMeus();
    if(x==='operador') carregarAdmin();
}

async function cadastrar() {
    const { error } = await _sb.from('usuarios').insert([{ usuario: u.value, senha: s.value, tipo: 'cliente' }]);
    alert(error ? "Usuário já existe!" : "Conta criada! Pode entrar.");
}

async function entrar() {
    const { data } = await _sb.from('usuarios').select('*').eq('usuario', u.value).eq('senha', s.value).single();
    if(data) {
        logado = data;
        telaAuth.style.display = 'none';
        telaSite.style.display = 'block';
        if(data.tipo === 'operador') { t3.style.display = 'block'; setInterval(carregarAdmin, 5000); }
        setInterval(carregarMeus, 5000);
    } else alert("Acesso negado.");
}

async function enviar() {
    let vip = tabPreco.value === 'parceiro';
    let total = 0, lista = [];
    for(let id in nomes) {
        let q = Number(document.getElementById('q_'+id).value) || 0;
        if(q > 0) {
            total += q * precos[vip?'parceiro':'normal'][id];
            lista.push(`${nomes[id]} (x${q})`);
        }
    }
    if(total === 0) return alert("Selecione itens!");

    const { error } = await _sb.from('pedidos').insert([{
        cliente: logado.usuario,
        itens: lista.join(", "),
        total: total,
        status: 'Pendente',
        data: new Date().toLocaleString()
    }]);

    if(error) alert("Erro ao enviar: " + error.message);
    else {
        alert("Pedido enviado!");
        document.querySelectorAll('input[type="number"]').forEach(i => i.value = "");
    }
}

async function carregarMeus() {
    const { data } = await _sb.from('pedidos').select('*').eq('cliente', logado.usuario).order('id', {ascending: false});
    if(data) meusPedidos.innerHTML = data.map(p => `
        <div class="pedido-card">
            <div style="display:flex; justify-content:space-between">
                <b style="color:${p.status==='Pronto'?'#22c55e':'#fbbf24'}">${p.status.toUpperCase()}</b>
                <small>${p.data}</small>
            </div>
            <p>${p.itens}</p>
            <b>Total: R$ ${p.total.toLocaleString()}</b>
        </div>
    `).join('');
}

async function carregarAdmin() {
    const { data } = await _sb.from('pedidos').select('*').order('id', {ascending: false});
    if(!data) return;
    if(data.length > 0 && data[0].id > ultimoId) {
        if(ultimoId !== 0) som.play().catch(()=>{});
        ultimoId = data[0].id;
    }
    adminPedidos.innerHTML = data.map(p => `
        <div class="pedido-card">
            <b>👤 ${p.cliente}</b> [${p.status}]<br>
            <small>${p.itens}</small><br>
            <b>R$ ${p.total.toLocaleString()}</b><br>
            <button onclick="mudarStatus(${p.id},'Pronto')" style="background:#22c55e; color:white; border:none; border-radius:4px; padding:5px; margin-top:5px; cursor:pointer">Marcar como Pronto</button>
        </div>
    `).join('');
}

async function mudarStatus(id, st) { await _sb.from('pedidos').update({ status: st }).eq('id', id); carregarAdmin(); }
async function limpar() { if(confirm("Apagar tudo?")) { await _sb.from('pedidos').delete().neq('id', 0); carregarAdmin(); } }
</script>
</body>
</html>
